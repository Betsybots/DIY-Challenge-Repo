# waypoints.yaml -- OBSTACLE COURSE waypoint sequence for diy_waypoint_sequencer
# ═══════════════════════════════════════════════════════════════════════════
# Map frame of diy_localization/map/Obstacle_course (mcl_map.pcd / obstacle_course_clean.pgm,
# origin = run3 start pose). Generated from the run3 driving line, centred in the lane on
# obstacle_course_clean.pgm, plus hoop gates measured in the run3 point cloud:
#   * Helix: 3 waypoints so the planner can't cut from the bridge straight into the tunnel.
#   * Bucket zone: NO waypoint inside it -- last one in the wide section, next one past the
#     36 in gap; the local costmap / MPPI avoids the buckets on the way.
#   * Hoops: before / through / after each gate, along the gate's crossing direction
#     (gate openings ~0.63-0.67 m; 'through' = gate centre). Hoops can be moved along their
#     dashed lines on the day: re-measure and update the three hoop groups if they move.
#   * Costmap obstacle height must stay below the hoop arch (0.36 m) or the arches block
#     the gates (see nav2_params_3d_obstacle_course_mppi_ackermann.yaml max_obstacle_height).
# yaw in radians (map frame). Previous (speed-course) version: git history of this file.

frame_id: "map"   # must match nav2_map_server's published /map frame
loop: true         # the run is 2 laps: wrap back to wp1 after the finish waypoint
loop_count: 2      # stop after 2 full laps (launch arg loop_count overrides; -1 there = use this)

waypoints:
