# waypoints.yaml — example waypoint sequence for diy_waypoint_sequencer
# ═══════════════════════════════════════════════════════════════════════════
# Replace with your real course waypoints (map-frame coordinates, meters).
# This is a DELIBERATELY SIMPLE schema — just a sequence of goal poses, not
# zone_nav's richer zone_waypoints.yaml (radius/exit_radius/mode/inflation_radius
# etc.) which encodes Nav2 costmap + BLIND_DRIVE state-machine behavior this
# A*/PD stack does not use at all. If you later need a real zone-aware state
# machine again, use zone_nav's config format instead — don't try to grow
# this one to match it; keep this file's job to just "which poses, in what
# order."

frame_id: "map"   # must match nav2_map_server's published /map frame
loop: false        # true = wrap back to the first waypoint after the last
# loop_count: 3    # optional: only used when loop is true -- caps the
                   # total number of full circuits before stopping instead
                   # of looping forever. Omit (or leave unset) for
                   # unlimited looping. Can also be set via the
                   # loop_count launch argument instead of in this file.

waypoints:
