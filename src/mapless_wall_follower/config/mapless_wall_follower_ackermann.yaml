# FIELD-TEST SPEED STRATEGY
# COURSE GEOMETRY: the speed-course drawing specifies a 36 in (0.9144 m)
# path. The 16 in (0.4064 m) vehicle has 10 in (0.254 m) clearance per side
# when centered, and its centerline is 18 in (0.4572 m) from either wall.
# Stage 1 - Stationary: keep the drive disabled; verify cloud axes (+x forward,
#   +y left, +z up), wall detections, state transitions, steering direction,
#   and that this is the only controller publishing to /cmd_vel_nav.
# Stage 2 - First motion (active defaults below): use 0.30 m/s straight and
#   0.15 m/s in turns. Verify emergency stopping and steering direction.
# Stage 3 - Course validation: after Stage 2 succeeds, use 0.50 m/s straight
#   and 0.25 m/s in turns. Require at least three clean runs without wall-loss,
#   oscillation, false turn entry, or emergency-stop overshoot.
# Stage 4 - 1.00 m/s straights: validated in the arena with straight_speed=1.00,
#   max_linear_acceleration=0.80, and turn_speed=0.25.
# Stage 5 - Adaptive speed profile (active defaults below): straight_speed is
#   only the straight-zone ceiling. Each cycle the speed is the minimum of:
#   - curve limit: sqrt(max_lateral_acceleration / k), where k is the larger of
#     the commanded curvature and the bend curvature previewed from where the
#     outer wall enters the front band (k = 2h / (d^2 - h^2), h=preview_wall_offset);
#   - clearance limit: speed that can still brake to emergency_stop_distance
#     along the commanded arc, allowing control_latency;
#   - turn_speed while only one wall is valid;
#   then floored at min_speed so the Ackermann steering keeps authority.
#   Approximate centerline speeds at max_lateral_acceleration=0.50:
#   6 ft hairpin ~1.1 m/s, 21.5 ft ~1.9 m/s, 35.5 ft+ and straights at ceiling.
#   Raise max_lateral_acceleration in 0.1 steps to go faster in all bends;
#   lower it if the car runs wide. Raise straight_speed for the 44 ft straights.
#   Watch preview_curvature, curve_speed_limit, clearance_speed_limit,
#   and path_clearance in CONTROL DEBUG.

mapless_wall_follower:
  ros__parameters:
    # Topics: body-frame FAST-LIO cloud directly to the autonomous mux input.
    cloud_topic: /cloud_registered_body
    cmd_vel_topic: /cmd_vel_nav
    enable_topic: /mapless_wall_follower/enable
    state_topic: /mapless_wall_follower/state
    debug_log_frequency: 2.0  # TUNE: controller diagnostic lines printed per second.
    start_enabled: false  # Safety: require an explicit enable message after launch.
    control_frequency: 20.0  # TUNE: raise only if point processing stays below the period.
    cloud_timeout: 0.30  # TUNE: stale-cloud age that forces a stop.
    point_stride: 3  # TUNE: larger reduces CPU but keeps fewer wall points.

    # Point-cloud region of interest in base_link: x forward, y left, z up.
    min_x: -0.20  # TUNE: small rear margin keeps walls visible during turns.
    max_x: 3.00  # TUNE: forward wall-fitting range.
    min_z: 0.10  # TUNE: reject ground returns below this height.
    max_z: 1.20  # TUNE: reject overhead returns above this height.
    side_min_abs_y: 0.22  # 0.203 m vehicle half-width plus a small body-return margin.
    side_max_abs_y: 1.50  # TUNE: maximum wall distance considered.
    front_half_width: 0.30  # Vehicle half-width plus 0.097 m detection margin.
    min_wall_points: 20  # TUNE: minimum RANSAC inliers for a valid wall.
    fit_residual_threshold: 0.08  # TUNE: wall inlier distance in meters.
    max_fit_rms: 0.06  # TUNE: maximum accepted fitted-wall RMS error.
    max_fit_points: 2000  # TUNE: CPU bound for points retained on each side.

    # Normal mode centers between both fitted walls.
    wall_lookahead: 0.80  # TUNE: wall position/heading evaluation distance.
    min_corridor_width: 0.70  # Reject wall pairs far narrower than the 0.9144 m path.
    max_corridor_width: 1.40  # Allows projected width growth while following curved walls.
    center_gain: 1.8  # TUNE: centering correction; lower if oscillating.
    heading_gain: 1.6  # TUNE: wall-heading correction; lower if steering is nervous.

    # Wall priority: both walls center; otherwise follow left, then right; neither stops.
    right_wall_target_distance: 0.46  # 18 in/0.4572 m course centerline, rounded to 0.46 m.
    left_wall_target_distance: 0.46  # Same centerline target measured from the left wall.
    right_wall_gain: 2.2  # TUNE: right-wall distance correction.
    left_wall_gain: 2.2  # TUNE: left-wall distance correction.
    right_turn_curvature_bias: 0.80  # TUNE: initial right steering when a front wall appears.
    turn_enter_front_distance: 1.20  # TUNE: enter right-turn mode before the front wall.
    emergency_stop_distance: 0.45  # Hard stop, measured along the commanded arc.

    # Ackermann command limits and adaptive speed profile.
    straight_speed: 1.50  # Straight-zone ceiling; set 1.00 for the first validation run.
    turn_speed: 0.25  # Ceiling while only one wall is valid.
    min_speed: 0.20  # Floor while driving so the steering keeps authority.
    max_lateral_acceleration: 0.50  # TUNE: main bend-speed knob in m/s^2.
    max_curvature: 2.70  # 1/m: tan(40 deg) / 0.31115 m wheelbase.
    max_yaw_rate: 1.35  # rad/s: also caps speed in tight curvature.
    max_linear_acceleration: 0.80  # TUNE: forward acceleration out of bends.
    max_linear_deceleration: 0.80  # TUNE: braking used by the clearance limit; keep achievable.
    max_curvature_rate: 3.00  # TUNE: 1/(m*s) steering slew; raise if turn entry lags.
    preview_wall_offset: 0.16  # 0.457 m centerline-to-wall minus 0.30 m front_half_width.
    control_latency: 0.20  # s: cloud + control + driver delay added to braking distance.

    # Wall-too-close recovery: on emergency_stop_distance, stop, reverse a few inches
    # while yawing away from the wall, stop, pre-steer away, then resume.
    recovery_max_attempts: 3  # Back-to-back attempts before latching EMERGENCY_FRONT_STOP; 0 disables.
    recovery_reverse_distance: 0.08  # m (~3 in), integrated from the reverse command.
    recovery_reverse_speed: 0.20  # TUNE: m/s; raise if the motor does not move in reverse.
    recovery_curvature: 1.50  # TUNE: 1/m steering while reversing; ~7 deg heading change at 0.08 m.
    recovery_pause: 0.30  # s at zero speed before and after reversing.
    recovery_reset_distance: 0.50  # m of forward driving that resets the attempt count.
    recovery_flip_after_attempts: 2  # Later attempts steer the opposite way as a fallback; 0 disables.

# Started only with wait_for_green_light:=true.
green_light_trigger:
  ros__parameters:
    green_light_topic: /color_detector/green_light
    red_light_topic: /color_detector/red_light  # RED after GREEN disables (latched).
    enable_topic: /mapless_wall_follower/enable
    required_consecutive: 3  # TUNE: consecutive green/red frames needed (debounce false positives).
    enable_publish_count: 5  # Enable/disable repeats once the wall follower is subscribed.
    enable_publish_rate: 10.0  # Hz for those repeats.
