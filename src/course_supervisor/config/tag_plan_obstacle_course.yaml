# AprilTag placement plan for the obstacle course (input for plan_tags).
# Each tag stands on top of a lane wall, at its inner edge, with the printed face
# turned back toward the approaching robot (no protrusion into the lane).
#   s:       metres along the driving line (see config/obstacle_course.yaml sections)
#   side:    wall the tag is on, as seen by the robot driving the course (right / left)
#   height:  tag centre above the floor (m); measure after mounting
#   section: optional, section this tag triggers (prints the trigger_range to use)
# AprilTag detection range on the robot (zed_apriltag on the Jetson): 2.0 m. Triggers
# fire closer (trigger_range <= 1 m). inset: tag centre behind the wall's inner face.
max_range: 2.0
inset: 0.03
map_yaml: ../../diy_localization/map/Obstacle_course/obstacle_course_clean.yaml
tags:
  # Ramp entry, LEFT wall at the foot of the 20% ramp. Fires 0.95 m before it, at the
  # ramp_and_bridge section start: last fix before the odometry-only stretch, and on
  # lap 2 it re-syncs progress there.
  - {id: 0, label: RampDetection, s: 3.65, side: left, height: 0.55, section: ramp_and_bridge, trigger_range: 0.95}
  # Helix bottom, before the bridge (not under the deck). Fix only.
  - {id: 4, label: HELIX_EXIT, s: 13.9, side: right, height: 0.55}
  # Tunnel exit: first bale of the 20 in lane's RIGHT wall, 0.4 m past the 32 -> 20 in
  # change. Seen from inside the tunnel looking out; fires at the exit -> wall follower.
  - {id: 2, label: TUNNEL_EXIT, s: 19.6, side: right, height: 0.55, section: narrow_path, trigger_range: 0.42}
  # Just after the gravel (past the 2 in ramp down), LEFT wall (closer to the robot's
  # line in this 46 in lane). Fires as the robot comes off the gravel -> Nav2 full speed.
  - {id: 1, label: NARROW_PATH_END, s: 31.2, side: left, height: 0.55, section: after_gravel_to_hoops, trigger_range: 0.89}
  # Car wash entry, LEFT wall ~0.8 m into the car wash (48 in lane). Fires at the car
  # wash start -> push-through. Mount where the ribbons don't hang in front of it.
  - {id: 3, label: CAR_WASH_ENTRY, s: 72.6, side: left, height: 0.55, section: car_wash, trigger_range: 0.82}
