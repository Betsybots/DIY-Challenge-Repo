cloud_topic: /cloud_registered_body
odom_topic: /odom
map_frame: map
local_frame: odom
update_hz: 2.0
# AMCL-style transform_tolerance: map->odom is broadcast stamped this far
# ahead of the sensor capture time, so Nav2 looking it up at "now()" (a bit
# later, due to processing/network latency) doesn't reject it as stale.
# Too small -> "old data"/timeout warnings; too large -> Nav2 accepts a more
# stale correction without complaint. 0.2-0.5s is a reasonable range here.
transform_tolerance: 0.3
# Merge this many of the most recent LiDAR scans (via their own paired
# odometry) into one cloud before each ICP alignment, instead of aligning a
# single scan against the map. 1 = disabled (this repo's original behavior).
# Higher values (2-5) give ICP a denser, more geometrically-constrained input
# -- useful given the QT64's ~1m blind zone -- at a small added per-cycle
# transform cost. Clamped to [1, 10].
accumulate_scans: 1
# Saved map to auto-load at startup (produced by map_hba). Leave empty to
# require an explicit /relocalize service call (which also supplies a
# pcd_path) before the node has any map to align against.
map_path: /home/juggernauts/DIY-Challenge-Repo/src/diy_localization/map/refined_map.pcd
# Optional fixed start pose (map frame), applied once right after map_path
# loads. Only takes effect if start_x is present -- omit all of these to
# instead rely on /initialpose (RViz "2D Pose Estimate") or /relocalize, or
# on odom origin already coinciding with map origin.
# 2026-09-23: confirmed correct as 0.0/0.0/0.0 -- checked the map's own
# recorded trajectory (src/diy_localization/map/refined_poses.txt, which
# refined_map.pcd was built from): its first entry ("0.pcd") is tx/ty/tz =
# (0.0013, 0.0003, -0.0009) with a near-identity quaternion, i.e. the
# mapping run's start pose IS the map frame's origin by construction (SLAM
# convention: world frame = identity at the first keyframe). So start_x/y/
# yaw = 0 is only valid if the robot is physically placed back at that
# exact real-world spot/heading (wherever PCD collection began) before this
# node starts -- if ICP still won't converge from here, suspect the robot
# not actually being at that physical spot this run (or a map/sensor
# mismatch), NOT this config value. Do not reintroduce a nonzero guess here
# without first checking refined_poses.txt the same way.
start_x: 0.0
start_y: 0.0
start_z: 0.0
start_yaw: 0.0
start_roll: 0.0
start_pitch: 0.0
# Reject an ICP realignment whose implied map->odom offset jumps further than
# this from the last accepted one (a good fitness score doesn't rule out a
# wrong local minimum in corridors/flat walls/symmetric rooms). Does not apply
# to the first alignment or to an explicit /relocalize call.
max_offset_jump_dist: 0.5
max_offset_jump_yaw: 0.3
# Auto-recovery: after this many CONSECUTIVE alignment failures (and every
# further multiple of it), sweep a grid of hypotheses derived from the loaded
# map's own point cloud (see computeRecoveryHypotheses() in localizer_node.cpp)
# trying to re-lock from scratch, instead of holding a possibly-stale offset
# forever. 0 disables auto-recovery. No external waypoints file needed --
# adapts automatically to whatever map is loaded (map_path or /relocalize).
# 2026-09-23: localizer_node.cpp's timerCB now also counts repeated
# jump-rejections toward this threshold (previously only outright align()
# failures counted -- see that file for the fix). Left at 0/disabled here
# since there's no measured/observed basis in this session for a specific
# nonzero value -- pick one deliberately (and how many seconds that implies
# at your update_hz) before turning this on, rather than trusting a guess.
recovery_after_failures: 0
recovery_grid_spacing: 2.0
recovery_yaw_samples: 4
# Blend accepted map->odom corrections over this many seconds instead of
# publishing a one-tick jump. Set to 0 to publish corrections immediately.
offset_smoothing_time_constant: 0.5

rough_scan_resolution: 0.25
rough_map_resolution: 0.25
# Fitness score of 0.018 was already well under rough_score_thresh (0.2) at
# only 5 iterations, but hasConverged() (an iteration-delta-epsilon check,
# NOT a fit-quality check) was still false -- it just needed more steps to
# formally settle. Raised from 5.
rough_max_iteration: 20
rough_score_thresh: 0.2
# VGICP's internal voxel covariance grid size (meters), separate from the
# scan/map downsample resolution above.
rough_vgicp_resolution: 1.0
num_threads: 4

refine_scan_resolution: 0.1
refine_map_resolution: 0.1
# Same reasoning as rough_max_iteration -- give the solver enough steps to
# actually flip hasConverged() true. Raised from 10.
refine_max_iteration: 30
refine_score_thresh: 0.1
refine_vgicp_resolution: 0.5

