mcl_3dl:
  ros__parameters:
    map_frame: "map"
    map_downsample_x: 0.05
    map_downsample_y: 0.05
    map_downsample_z: 0.05
    # /odom comes from lio_ekf (fast_lio_ros2/lio_ekf.launch.py): the pose of base_footprint,
    # with TF odom -> base_footprint. The particles must track that same frame, otherwise
    # map -> odom absorbs the base_footprint -> base_link (or camera) offset.
    odom_frame: "odom"
    robot_frame: "base_footprint"
    # Starting pose of robot_frame (base_footprint) in the map.
    # The map origin is where the FAST-LIO body frame was at the start of run3,
    # facing the direction the robot drove off; the floor is at z ≈ -0.12 in this
    # map (its floor is cropped out, the wall band starts at about -0.08).
    # base_footprint sits on the floor, so init_z = 0.0 (height above floor) - 0.12.
    # Start on the same spot and heading as run3 for x/y/yaw = 0. The body frame is
    # ahead of base_footprint by the sensor's x offset (not exactly known); the
    # init_var_* below are standard deviations (m / rad) and cover that.
    init_x: 0.0
    init_y: 0.0
    init_z: 0.0
    init_yaw: 0.35
    init_var_x: 2.0
    init_var_y: 2.0
    init_var_z: 0.5
    init_var_yaw: 0.5
    # Hard-clamps every particle's z back to fix_z_value (defaults to init_z,
    # i.e. -0.12 here) after every predict/resample cycle, so z can't slowly
    # random-walk away on flat ground even though mcl_3dl is a full 6DOF filter.
    # DISABLE this (set false) before relying on real z tracking, e.g. the ramp.
    fix_z: true
    accum_cloud: 2
    lpf_step: 1.0
    dist_weight_z: 2.0
    likelihood:
      match_dist_min: 0.5
      match_output_dist: 0.3
obj_to_pointcloud:
  ros__parameters:
    frame_id: "map"
    points_per_meter_sq: 1200.0
    downsample_grid: 0.1
pcd_to_pointcloud:
  ros__parameters:
    file_name: "/home/juggernauts/DIY-Challenge-Repo/src/diy_localization/map/refined_map.pcd"
    publish_rate: 1.0
    tf_frame: "map"
    latch: true