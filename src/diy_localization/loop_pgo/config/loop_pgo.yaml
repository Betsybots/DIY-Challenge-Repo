cloud_topic: /cloud_registered_body
odom_topic: /odom
imu_topic: /imu/data
map_frame: map
local_frame: odom

reject_imu_shocks: true
gravity_magnitude: 9.81
shock_accel_deviation_threshold: 4.0
shock_cooldown: 0.3
# Ported from map_localizer (same problem, same fix, see its own yaml/
# CHANGES_REPORT.md): smooths the broadcast map->odom TF instead of snapping
# to it in one tick whenever smoothAndUpdate() shifts the offset (every new
# keyframe, and especially right after a loop closure factor is accepted and
# ISAM2 reoptimizes). REP-105 documents map->odom as allowed to jump and
# odom as the frame consumers should use for continuous local control (this
# repo's motion_controller already does, via costmap_ros_->getGlobalFrameID()) --
# this setting is purely for smoother visualization/high-level consumers, not
# a correctness requirement. <= 0 restores instant-snap behavior.
offset_smoothing_time_constant: 0.5

key_pose_delta_deg: 15  # degrees between consecutive key poses
key_pose_delta_trans: 0.5  # meters between consecutive key poses
loop_search_radius: 1.0  # meters for the loop search radius

# num_exclude_recent and loop_search_radius are course-scale-dependent -- see
# CHANGES history: indoor 10x6m course uses 20/1.0m below; a 30x20m outdoor
# course needs ~90/2.0-3.0m instead (bigger loop -> more accumulated drift by
# the time you return).
num_exclude_recent: 20  # number of most recent keyframes to exclude from loop closure search (indoor 10x6m course; use 90 for the 30x20m outdoor course)

# 2026-09-24: reverted from an over-tightened 0.05 back to 0.10 -- that was
# too strict (SC_DIST_THRES papers/reference implementations use ~0.13) and,
# combined with the other independent aliasing guards already in place
# (path-length travelled gate, ICP-correction-vs-guess gate, 3x consistency
# requirement in searchForLoopPairs()), was causing genuine revisits to never
# get detected at all ("no loop found" even after returning to the start).
# If you see false "[Loop found]" entries again, tighten gradually (e.g. 0.10
# -> 0.08) rather than jumping straight back to 0.05.
sc_dist_thres: 0.10
loop_score_tresh: 0.08
loop_submap_half_range: 5
submap_resolution: 0.1
# 2026-09-24: lowered 5.0 -> 1.0, referencing RTAB-Map's loop-closure design
# (github.com/introlab/rtabmap wiki): RTAB-Map checks for graph constraints
# against nearby nodes on almost every new frame, building up MANY edges
# around a revisited area rather than a single one-shot closure. Our own
# gates (fitness/correction/consistency in searchForLoopPairs(), plus the
# post-optimization residual check in smoothAndUpdate()) already guard
# against false positives independently of this cooldown -- a long 5s block
# was only serving to prevent additional, genuinely-good closures near the
# SAME revisit from ever being added, which is exactly why a single accepted
# loop could still leave the seam (last scan vs. first scan) visibly
# misaligned: only two nodes (source/target) were ever directly tied
# together, instead of the whole local neighborhood. 1.0s still avoids
# re-triggering on the literal same instant.
min_loop_detect_duration: 1.0

# Lowered 5 -> 3 (back toward the original default): searchForLoopPairs() now
# also rejects any candidate whose ICP correction deviates too far from its
# initial guess (see the comment there), an independent check against the
# same symmetric-room-aliasing failure mode this count was raised to guard
# against -- with that gate in place, requiring 5 straight consistent
# detections just slows down genuine loop closure on a short course without
# adding real protection.
loop_consistency_count: 3

# Sequential odometry between-factor noise, scaled by how far odometry says
# the robot actually moved/turned across each edge (see simple_pgo.cpp
# addKeyPose()). 2026-09-23: replaced a fixed, very tight noise (variance
# 1e-6 rot / 1e-4 trans regardless of edge length) that was diagnosed as the
# likely cause of "multiple corner layers"/double-wall ghosting in saved
# maps -- that tight a noise makes every odometry edge almost rigid, so even
# a correctly-detected loop closure can only nudge the trajectory slightly
# instead of smoothing out accumulated drift back through the loop. Tune
# these to your odometry's real drift rate if ghosting persists; the small
# fixed floors that used to be separate parameters now live in addKeyPose()
# directly (they only guard the near-zero-delta edge case, not something
# that needs per-course tuning).
odom_trans_noise_per_meter: 0.05
odom_rot_noise_per_rad: 0.05