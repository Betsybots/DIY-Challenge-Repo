# Input topics and TF frame names.
cloud_topic: /cloud_registered_body
odom_topic: /odom
imu_topic: /imu/data
map_frame: map
local_frame: odom

# IMU shock rejection: drop clouds arriving within shock_cooldown (seconds)
# after |accel| deviates from gravity_magnitude (m/s^2) by more than
# shock_accel_deviation_threshold (m/s^2). Filters out bumps/collisions.
reject_imu_shocks: true
gravity_magnitude: 9.81
shock_accel_deviation_threshold: 4.0
shock_cooldown: 0.3

# Keyframe spacing: a new keyframe is added once the robot moves more than
# key_pose_delta_trans (meters) or turns more than key_pose_delta_deg
# (degrees) since the last one.
key_pose_delta_deg: 15
key_pose_delta_trans: 0.5
# Radius (meters) around the latest keyframe to search for a nearby older
# keyframe as a loop-closure candidate.
loop_search_radius: 1.0

# Keyframe-count gap: candidates within this many keyframes of the current
# one are excluded from both the radius search and ScanContext, so a robot
# can't "loop close" against itself mid-motion. Scale with course size
# (bigger loop = more keyframes before a real revisit).
num_exclude_recent: 20

# ScanContext descriptor-distance threshold (unitless, ~0-2 scale): lower
# = stricter match required before ScanContext proposes a candidate. Lower
# this if you see false "[Loop found]" entries in a symmetric/repetitive room.
sc_dist_thres: 0.10
# Max accepted ICP fitness score (mean squared point-to-plane distance,
# meters^2) for a loop-closure candidate. Lower = stricter/fewer false
# positives, higher = more permissive.
loop_score_tresh: 0.05
# Loop-closure submap size: how many neighboring keyframes (each side) get
# merged into the target submap for ICP matching.
loop_submap_half_range: 5
# Voxel size (meters) submaps are downsampled to before ICP.
submap_resolution: 0.1
# Minimum time (seconds) between loop-closure attempts, to avoid re-triggering
# on the same revisit instantly.
min_loop_detect_duration: 3.0

# Number of consecutive, mutually-consistent candidate detections (within a
# few-keyframe gap, see kLoopConsistencyMaxKeyframeGap in simple_pgo.cpp)
# required before a loop closure is actually accepted.
loop_consistency_count: 3

# Sequential odometry edge noise: 1-sigma uncertainty per meter travelled /
# per radian turned between consecutive keyframes. Higher = edges are looser
# (loop closures can bend the trajectory more); lower = edges are stiffer.
odom_trans_noise_per_meter: 0.02
odom_rot_noise_per_rad: 0.02

# GTSAM ISAM2 solver tuning: relinearize a variable once its change exceeds
# this threshold, checked every isam2_relinearize_skip update() calls.
isam2_relinearize_threshold: 0.01
isam2_relinearize_skip: 1

# FastGICP loop-closure ICP tuning. icp_max_correspondence_distance (meters)
# should roughly match the submap's real extent (loop_submap_half_range *
# key_pose_delta_trans) so ICP can't match across open space to the wrong
# structure. icp_correspondence_randomness = neighbor count used per point's
# local plane estimate. icp_max_iterations = solver iteration budget.
# icp_transformation_epsilon = per-iteration convergence tolerance (meters).
icp_max_correspondence_distance: 1.0
icp_correspondence_randomness: 20
icp_max_iterations: 50
icp_transformation_epsilon: 1e-6

# Hybrid loop-factor noise (see conditionLoopInformation() in simple_pgo.cpp):
# ICP fitness score sets an isotropic noise floor for all 6 DOF; the ICP
# Hessian's eigenvalue ratio (unitless, vs. strongest direction) only loosens
# directions below this threshold, never tightens below the floor.
hessian_degeneracy_ratio_threshold: 0.05
# Cap on the loosened variance (meters^2 / rad^2) for a degenerate direction,
# so a near-zero eigenvalue ratio can't produce a numerically unusable value.
hessian_max_variance: 4.0