# ─────────────────────────────────────────────────────────────────────────────
# zone_waypoints.yaml
# Course zone definitions for the SIMULATION competition arena.
#
# Coordinates are in the MAP frame (metres).
# Origin (0,0) = start/finish gate (east face, where start posts stand).
#
# Arena layout:
#   Leg 1: +X direction, centerline y=0,   x= 0..13
#   Leg 2: -Y direction, centerline x=13,  y= 0..-13  (narrow section mid-leg)
#   Leg 3: -X direction, centerline y=-13, x=13..0    (bumps, buckets, wide section)
#   Leg 4: +Y direction, centerline x=-0.5,y=-13..0   (tunnel mid-leg)
#   Gate:  x=-1..0, y=±0.525 — finish posts (x=-1) adjacent to start posts (x=0)
#
# ZONE FORMAT:
#   x, y        — centre of zone trigger point (map frame metres)
#   radius      — entry trigger distance (metres)
#   exit_radius — exit trigger distance (hysteresis, must be > radius)
#   mode        — SLOW_NAV | BLIND_DRIVE | NAVIGATE_AROUND | PUSH_THROUGH
#   label       — human-readable name for logging
# ─────────────────────────────────────────────────────────────────────────────

zones:

  # ── Zone 0: Turn 1 (Leg1→Leg2, x≈12..13, y≈0..-1) ────────────────────────
  # 90° right turn in 1.05m corridor. SLOW_NAV ensures turn radius ~0.17m fits.
  # Turn pocket: x=12.475..13.525, y=-0.525..+0.525 → navigable centre is x=13.0
  # inflation_radius=0.15: navigable x band = 12.825..13.175 (0.35m) — room to arc
  - label:            "turn1"
    x:                13.0
    y:                -0.5
    radius:           1.2
    exit_radius:      1.25
    mode:             "SLOW_NAV"
    inflation_radius: 0.25    # simple_loop: no keepout, full corridor — 1.05m − 0.40m − 2×0.25m = 0.15m margin

  # ── Zone 1: Ramp (Leg 1, x≈5.0..6.28, y=0) ───────────────────────────────
  # 0.06m timber ramp (7°), up 0.49m + flat 0.3m + down 0.49m = 1.28m total.
  # SLOW_NAV prevents odometry spikes from wheel lifting.
  - label:       "ramp"
    x:           5.639   # ramp_flat centre
    y:           0.0
    radius:      0.8
    exit_radius: 1.6
    mode:        "SLOW_NAV"

  # ── Zone 2: Narrow Section (Leg 2, x=13, y=-2.4..-5.7) ───────────────────
  # Corridor pinched to 0.508 m (20 in).  Robot is ~0.3 m wide → 2" per side.
  # Reduce inflation_radius so the planner can still find a path.
  # ndt_fitness_gate: warn if localisation is poor before committing.
  - label:            "narrow_section"
    x:                13.0    # corridor centreline
    y:                -5.031  # mid-point of straight narrow walls (y=-4.0 .. -6.062)
    radius:           3.5
    exit_radius:      5.0
    mode:             "SLOW_NAV"
    inflation_radius: 0.03
    ndt_fitness_gate: 0.5     # warn if NDT is weak before 2" clearance

  # ── Zone 3: Bucket Obstacles (Leg 3, x≈6.5..9.3, y≈-13) ─────────────────
  # Five 5-gallon buckets staggered across the corridor.
  # NAVIGATE_AROUND keeps the obstacle layer active for dynamic replanning.
  - label:       "bucket_obstacles"
    x:           8.0      # cluster centroid
    y:           -13.0
    radius:      2.5
    exit_radius: 4.5
    mode:        "NAVIGATE_AROUND"

  # ── Zone 5: Turn 2 (Leg2→Leg3, x≈13, y≈-13) ──────────────────────────────
  - label:       "turn2"
    x:           13.0
    y:           -12.5
    radius:      1.2
    exit_radius: 2.0
    mode:        "SLOW_NAV"

  # ── Zone 6: Turn 3 (Leg3→Leg4, x≈0, y≈-13) ───────────────────────────────
  - label:       "turn3"
    x:           0.0
    y:           -12.5
    radius:      1.2
    exit_radius: 2.0
    mode:        "SLOW_NAV"

  # ── Zone 7: Turn 4 / Finish (Leg4→Leg1, x≈-0.5, y≈0) ────────────────────
  - label:       "turn4"
    x:           -0.5
    y:           -0.5
    radius:      1.2
    exit_radius: 2.0
    mode:        "SLOW_NAV"

  # ── Zone 4: Tunnel (Leg 4, x=-0.5, y=-6.5) ───────────────────────────────
  # Enclosed 0.81 m × 1.52 m tunnel, 0.635 m tall.
  # BLIND_DRIVE: robot dead-reckons on wheel + IMU; lidar gated off so
  # reflections from the walls don't corrupt FAST-LIO2 / NDT.
  # Exit is triggered by NDT fitness recovery after blind_drive_min_duration_s.
  #
  # NOTE (Bug44/45): do NOT add a tunnel_exit zone here — it would set
  # active_zone_idx_ and block the next zone trigger until the robot clears
  # exit_radius. The BLIND_DRIVE exit is fitness-driven, not geometric.
  - label:       "tunnel"
    x:           -0.5     # Leg 4 centreline (x = -1.0..0)
    y:           -6.5     # tunnel centre (y = -7.26..-5.74)
    radius:      1.0
    exit_radius: 2.5
    mode:        "BLIND_DRIVE"

# ── Finish line ───────────────────────────────────────────────────────────────
# Placed at the centre of the start/finish gate opening.
# The robot crosses this point at the END of each lap (coming north along Leg 4).
# initial state in_finish_zone_=true means the spawn position is already inside
# the zone; the robot must leave and return to count lap 1.
finish_line:
  x:      -0.5    # centre of gate corridor (between start post x=0 and finish post x=-1)
  y:       0.0    # y=0 threshold — crossed when robot returns from Leg 4
  radius:  1.0    # lap counted when robot is within 1.0 m of this point

# ── Race settings ─────────────────────────────────────────────────────────────
total_laps: 3     # stop after 3 complete laps (zone_nav_manager transitions to DONE)
