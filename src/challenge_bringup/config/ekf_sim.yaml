# ─────────────────────────────────────────────────────────────────────────────
# ekf_sim.yaml — Sim-only EKF: wheel odom + IMU (angular rate) → /FinalOdometry
# ─────────────────────────────────────────────────────────────────────────────
# Simulation has no FAST-LIO2/map_localizer stack (see localization/ package
# for the real-robot equivalent, ekf_odom.yaml). This fuses just the two
# sensors the sim bridge exposes:
#   /wheel_odom  — DiffDrive wheel-encoder odometry (velocity only; wheel
#                  slip on ramps/gravel makes position untrustworthy, same
#                  assumption as the real-robot EKF)
#   /imu         — Ignition IMU sensor, angular velocity only
#
# Output: remapped to /FinalOdometry by sim_launch.py (default topic name
# for this node is odometry/filtered). TF: odom -> base_link.
#
# Fused state: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
# ─────────────────────────────────────────────────────────────────────────────

ekf_filter_node_sim:
    ros__parameters:
        frequency: 50.0
        sensor_timeout: 0.1
        two_d_mode: true
        transform_time_offset: 0.0
        transform_timeout: 0.0
        print_diagnostics: true
        debug: false

        map_frame:       map
        odom_frame:      odom
        base_link_frame: base_link
        world_frame:     odom

        publish_tf: true
        publish_acceleration: false

        # ── Input 0: wheel encoder odometry — velocity only ──────────────────
        odom0: /wheel_odom
        odom0_config: [false, false, false,   # x  y  z
                       false, false, false,   # roll pitch yaw
                       true,  true,  false,   # vx vy vz
                       false, false, true,    # vroll vpitch vyaw
                       false, false, false]   # ax ay az
        odom0_queue_size: 10
        odom0_nodelay: true
        odom0_differential: false
        odom0_relative: false

        # ── Input 1: IMU — angular velocity only ─────────────────────────────
        imu0: /imu
        imu0_config: [false, false, false,   # x  y  z
                      false, false, false,   # roll pitch yaw
                      false, false, false,   # vx vy vz
                      true,  true,  true,    # vroll vpitch vyaw
                      false, false, false]   # ax ay az
        imu0_queue_size: 10
        imu0_nodelay: true
        imu0_differential: false
        imu0_relative: false
