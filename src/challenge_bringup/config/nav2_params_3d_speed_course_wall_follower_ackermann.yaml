# Additive override for nav2_params_3d_speed_course_ackermann.yaml.
# It selects the independent wall-follower controller plugin while retaining
# the existing GridBased Smac Hybrid-A* planner and all base costmap settings.

bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: "$(find-pkg-share challenge_bringup)/behavior_trees/navigate_to_pose_wall_follower_ackermann.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share challenge_bringup)/behavior_trees/navigate_through_poses_wall_follower_ackermann.xml"

controller_server:
  ros__parameters:
    controller_plugins: ["WallFollow"]

    WallFollow:
      plugin: "wall_follower_controller::WallFollowerController"

      # FIELD-TUNE-WALL-01: input and freshness
      pointcloud_topic: /cloud_registered_body
      base_frame: base_footprint
      transform_tolerance: 0.10
      cloud_timeout: 0.30
      point_stride: 5

      # FIELD-TUNE-WALL-02: wall point selection in base_footprint
      wall_min_x: -0.10
      wall_max_x: 2.50
      wall_min_abs_y: 0.15
      wall_max_abs_y: 2.00
      wall_min_z: 0.10
      wall_max_z: 1.50
      minimum_wall_points: 30
      wall_fit_residual: 0.08
      minimum_corridor_width: 0.40
      maximum_corridor_width: 3.00

      # FIELD-TUNE-WALL-03: wall correction added to path curvature
      # Start with small gains. Increase lateral gain if the car remains
      # off-center; increase heading gain if it points diagonally in the lane.
      lateral_error_gain: 1.50
      heading_error_gain: 1.00
      maximum_wall_correction: 0.75
      stop_on_wall_loss: true
      wall_loss_speed: 0.20

      # FIELD-TUNE-WALL-04: path tracking and preview braking
      desired_linear_velocity: 3.00
      minimum_corner_velocity: 0.25
      maximum_angular_velocity: 2.00
      minimum_lookahead_distance: 0.25
      maximum_lookahead_distance: 1.00
      lookahead_time: 1.00
      curvature_scaling_min_radius: 1.50
      speed_preview_distance: 6.00

      # FIELD-TUNE-WALL-05: measured vehicle limits
      maximum_lateral_acceleration: 1.50
      maximum_deceleration: 0.80
      wheelbase: 0.31115
      maximum_steering_angle: 0.6981317
      goal_tolerance: 0.20

      # FIELD-TUNE-WALL-06: mapped-wall collision prediction
      collision_check_enabled: true
      collision_time_horizon: 1.00
      collision_step_time: 0.05
      unknown_is_occupied: true
