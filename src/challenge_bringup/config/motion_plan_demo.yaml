# Aug 14 Demo — Path Following Demonstration
# ─────────────────────────────────────────────
# Sequence: forward motion → controlled 90° turn → return to forward motion
# Meets requirement §0.2.4.1: forward + controlled 90° turn + forward
#
# Speeds are conservative for first hardware demo.
# Increase linear_velocity to 0.5 and angular_velocity to 0.4 once verified.

motions:
  - type: STRAIGHT
    distance: 2.0
    linear_velocity: 0.3

  - type: TURN
    angle: 1.5708        # π/2 = 90 degrees
    angular_velocity: 0.3

  - type: STRAIGHT
    distance: 2.0
    linear_velocity: 0.3
