# Ackermann Nav2 configuration for the fixed speed course.
# The course walls must be present in the static occupancy map. There are no
# dynamic obstacles, so the costmaps do not run voxel or obstacle layers.
#
# FIELD-TUNE QUICK INDEX
# Search this file for "FIELD-TUNE" to jump to every field-test parameter:
#   FIELD-TUNE-01: straight speed (change controller and smoother together)
#   FIELD-TUNE-02: speed-dependent Pure Pursuit lookahead
#   FIELD-TUNE-03: corner speed from curvature
#   FIELD-TUNE-04: collision prediction time
#   FIELD-TUNE-05: close-wall costmap clearance
#   FIELD-TUNE-06: measured minimum turning radius
#   FIELD-TUNE-07: acceleration and braking
# Change one group at a time and record at least three runs before increasing it.

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    default_nav_to_pose_bt_xml: "$(find-pkg-share challenge_bringup)/behavior_trees/navigate_to_pose_speed_course_ackermann.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share challenge_bringup)/behavior_trees/navigate_through_poses_speed_course_ackermann.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_condition_bt_node
      - nav2_wait_cancel_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    odom_topic: /odom
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.0
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 5.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.35

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # FIELD-TUNE-01 STRAIGHT SPEED
      # Must match velocity_smoother.max_velocity[0] below. Increase in small
      # steps; this is a test ceiling, not a verified safe competition speed.
      desired_linear_vel: 3.00

      # FIELD-TUNE-02 LOOKAHEAD
      # If the car oscillates at speed, increase lookahead_time or max distance.
      # If it cuts inside a hairpin, reduce them. Change one value per test.
      lookahead_dist: 0.50
      min_lookahead_dist: 0.25
      max_lookahead_dist: 1.00
      lookahead_time: 1.00
      use_velocity_scaled_lookahead_dist: true
      use_interpolation: true

      transform_tolerance: 0.10
      min_approach_linear_velocity: 0.10
      approach_velocity_scaling_dist: 0.60

      # FIELD-TUNE-03 CORNER SPEED
      # Larger min radius starts slowing on gentler curves. Minimum speed is
      # the lowest curvature-regulated hairpin speed, not the straight speed.
      # Wall-cost regulation stays off because both mapped walls are always close.
      use_regulated_linear_velocity_scaling: true
      # At 3.0 m/s, starting regulation at a 1.5 m radius keeps
      # yaw_rate = linear_speed / turn_radius = 3.0 / 1.5 = 2.0 rad/s.
      regulated_linear_scaling_min_radius: 1.50
      regulated_linear_scaling_min_speed: 0.25
      use_cost_regulated_linear_velocity_scaling: false

      # FIELD-TUNE-04 COLLISION PREDICTION
      # Time horizon only; at 3 m/s, 1.0 second is about 3 m of travel.
      # It does not replace measured braking-distance or corner-preview logic.
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.00

      use_fixed_curvature_lookahead: true
      curvature_lookahead_dist: 0.50
      use_rotate_to_heading: false
      rotate_to_heading_angular_vel: 0.0
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6.0
      height: 6.0
      resolution: 0.05
      footprint: "[[-0.12, -0.18], [-0.12, 0.18], [0.44, 0.18], [0.44, -0.18]]"
      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true
        transform_tolerance: 0.20

      # FIELD-TUNE-05 CLOSE-WALL CLEARANCE
      # If the corridor appears blocked, first verify map/footprint alignment,
      # then reduce inflation_radius slightly. Do not shrink the true footprint.
      # Higher cost_scaling_factor makes inflated wall cost decay faster.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.20
        cost_scaling_factor: 10.0

      always_send_full_costmap: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      rolling_window: false
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[-0.12, -0.18], [-0.12, 0.18], [0.44, 0.18], [0.44, -0.18]]"
      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # FIELD-TUNE-05: keep these equal to the local costmap values.
        inflation_radius: 0.20
        cost_scaling_factor: 10.0

      always_send_full_costmap: false

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "$(find-pkg-share challenge_bringup)/maps/speed_run1_ekf_map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.20
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0

      # The course is intended to be completed forward without reversing.
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      # FIELD-TUNE-06 TURNING RADIUS
      # Replace only with the measured full-lock path radius. A value smaller
      # than the real vehicle radius creates paths the car cannot follow.
      minimum_turning_radius: 0.371
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015

      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      debug_visualizations: false
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true
      allow_primitive_interpolation: false
      smooth_path: true

      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.10
    simulate_ahead_time: 2.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "CLOSED_LOOP"

    # FIELD-TUNE-01 STRAIGHT SPEED
    # max_velocity[0] must match desired_linear_vel above.
    # [linear.x, linear.y, angular.z]. Curvature regulation limits requested
    # yaw rate to approximately 3.0 / 1.5 = 2.0 rad/s.
    max_velocity: [3.00, 0.0, 2.00]
    min_velocity: [0.0, 0.0, -2.00]

    # FIELD-TUNE-07 ACCELERATION AND BRAKING
    # [linear.x, linear.y, angular.z]. Increase only from measured field data.
    # At 0.50 m/s^2, reaching 3.0 m/s takes 6 s and about 9 m.
    # At 0.80 m/s^2 braking, stopping from 3.0 m/s takes at least about 5.6 m.
    max_accel: [0.50, 0.0, 1.5]
    max_decel: [-0.80, 0.0, -1.5]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
