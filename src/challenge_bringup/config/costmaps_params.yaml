# =============================================================================
# costmaps_params.yaml — global_costmap + local_costmap for the custom
# A*/pure-pursuit stack (NOT nav2_params.yaml's bt_navigator/full-Nav2 config,
# which stays dormant/unused — see that file's own comments).
#
# WHY planner_server/controller_server APPEAR HERE AT ALL:
# Nav2's costmap (nav2_costmap_2d::Costmap2DROS) has no standalone launcher
# that can run twice at once — the bare `nav2_costmap_2d` executable hardcodes
# its own node name internally (confirmed empirically, 2026-09-15: tried
# name=/namespace= overrides, both silently ignored, both instances collided
# on the identical node name "costmap"). planner_server/controller_server are
# simply the only two pre-built Nav2 programs that construct a Costmap2DROS
# with a distinct, correct name ("global_costmap"/"local_costmap" respectively).
#
# UPDATE 2026-09-15: FollowPath's plugin below is now the REAL, actively used
# diy_motion_planner::PurePursuitController (see
# src/diy_motion_planner/src/pure_pursuit_controller.cpp) — a genuine
# nav2_core::Controller port of the same control law the standalone
# pure_pursuit_motion_planner_node has always used. It only runs when
# something sends a FollowPath action goal, though — nothing does yet (no
# bt_navigator, and diy_planning's a_star_planner_node still just publishes
# /a_star/path as a plain topic, not an action goal). Until that gap is
# bridged, test this controller directly with a manually-published
# FollowPath goal (see scripts/test_follow_path_action.py).
#
# GridBased (planner_server's plugin) is STILL a placeholder/unused --
# nothing calls ComputePathToPose either; a teammate is separately porting
# diy_planning's A* into a real nav2_core::GlobalPlanner plugin to replace it.
#
# REAL-HARDWARE DEFAULTS: use_sim_time: false, robot_base_frame: base_link
# (not base_footprint/true — those were this file's sim-only counterpart in
# the old, dormant nav2_params.yaml). Override at launch if you actually need
# a sim run.
# =============================================================================

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[ [0.35, 0.20], [0.35, -0.20], [-0.35, -0.20], [-0.35, 0.20] ]"
      resolution: 0.025   # matches maps/course_traced_smooth.yaml — override if using a different map
      rolling_window: false
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.22   # robot half-width 0.20m + 0.02m margin

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[ [0.35, 0.20], [0.35, -0.20], [-0.35, -0.20], [-0.35, 0.20] ]"
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        # nav2_costmap_2d's internal VoxelGrid packs each column into a
        # bitfield with a HARD CAP of 16 z-values (confirmed empirically,
        # 2026-09-15: z_voxels=40 crashes at runtime with "Error, this
        # implementation can only support up to 16 z values"). To still
        # cover max_obstacle_height end-to-end without exceeding that cap,
        # z_resolution is widened instead: 16 * 0.125 = 2.0m exactly.
        z_resolution: 0.125
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: lidar_points
        lidar_points:
          topic: /lidar_points
          data_type: "PointCloud2"
          marking: true
          clearing: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.22

# ── Below: minimal, valid (but UNUSED) planner/controller plugin config ─────
# Required only so planner_server/controller_server can configure/activate
# without erroring on a missing plugin — never actually invoked (see header).

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.25
      use_astar: false
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 3.14159
      stateful: true
    FollowPath:
      # Real controller plugin (see src/diy_motion_planner/src/pure_pursuit_controller.cpp),
      # not a placeholder — this is diy_motion_planner's actual pure-pursuit
      # control law, now loadable as a genuine nav2_core::Controller plugin.
      # Same parameter names/defaults as the original standalone node.
      plugin: "diy_motion_planner::PurePursuitController"
      lookahead_distance: 0.2
      linear_velocity: 0.3
      max_angular_velocity: 1.0
      rotate_in_place_threshold: 1.0
      minimum_turning_velocity: 0.05
      goal_tolerance: 0.15
      transform_tolerance: 0.1
