map_server:
  ros__parameters:
    use_sim_time: False 
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: "/home/juggernauts/DIY-Challenge-Repo/src/challenge_bringup/maps/global_map.yaml"
    
map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["AStarPlanner"]
    AStarPlanner:
      plugin: "diy_astar_planner::AStarPlanner"
      robot_clearance: 0.40
      occupied_threshold: 253
      unknown_is_occupied: true
      visited_publish_interval: 250

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait", "backup"]  # Only these are used in your BTs
    wait:
      plugin: "nav2_behaviors/Wait" # Usage: Pause navigation during recovery sequences (5s wait in your recovery_actions)
    backup:
      plugin: "nav2_behaviors/BackUp" # Usage: Move backward when stuck (0.15m backup_dist in your recovery_actions)
    
    # ============ OPTIONAL RECOVERY BEHAVIORS ============
    # spin:
    #   plugin: "nav2_behaviors/Spin"
    #   # Usage: 360° rotation to escape narrow corridors (REMOVED: caused backward wall collisions in your case)
    # drive_on_heading:
    #   plugin: "nav2_behaviors/DriveOnHeading"
    #   # Usage: Move forward/backward along specific heading without path planning (useful for aligned recovery, e.g., backing out of a hallway)
    # assisted_teleop:
    #   plugin: "nav2_behaviors/AssistedTeleop"
    #   # Usage: Manual teleop control with collision checking (useful for manual recovery when autonomous is stuck)

    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0  # Lookahead time for collision checking during behaviors
    max_rotational_vel: 1.0   # Max rotation speed if spin is added (rad/s)
    min_rotational_vel: 0.4   # Min rotation speed (keeps rotation smooth)
    rotational_acc_lim: 3.2   # Rotation acceleration limit (rad/s²)

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/Odometry"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# NOTE 2026-09-24: stale/unused -- this section paired with the dead
# nav2_localization_launch.py, not master.launch.py's live path. The
# 'map_localizer' package it configures was removed in favor of RTAB-Map.
map_localizer:
  ros__parameters:
    cloud_topic: /cloud_registered_body
    odom_topic:  /Odometry                     #/Odometry
    map_frame: map
    local_frame: odom
    update_hz: 1.0
    # Saved map to auto-load at startup (produced by map_hba). Leave empty to
    # require an explicit /relocalize service call (which also supplies a
    # pcd_path) before the node has any map to align against.
    map_path: /home/juggernauts/DIY-Challenge-Repo/src/diy_localization/map/refined_map.pcd
    # Optional fixed start pose (map frame), applied once right after map_path
    # loads. Only takes effect if start_x is present -- omit all of these to
    # instead rely on /initialpose (RViz "2D Pose Estimate") or /relocalize, or
    # on odom origin already coinciding with map origin.
    start_x: -20.4
    start_y: -6.45
    start_z: 0.0
    start_yaw: 0.0
    start_roll: 0.0
    start_pitch: 0.0
    # Reject an ICP realignment whose implied map->odom offset jumps further than
    # this from the last accepted one (a good fitness score doesn't rule out a
    # wrong local minimum in corridors/flat walls/symmetric rooms). Does not apply
    # to the first alignment or to an explicit /relocalize call.
    max_offset_jump_dist: 0.5
    max_offset_jump_yaw: 0.3
    
    rough_scan_resolution: 0.25
    rough_map_resolution: 0.25
    rough_max_iteration: 5
    rough_score_thresh: 0.2
    # VGICP's internal voxel covariance grid size (meters), separate from the
    # scan/map downsample resolution above.
    rough_vgicp_resolution: 1.0
    num_threads: 4
    
    refine_scan_resolution: 0.1
    refine_map_resolution: 0.1
    refine_max_iteration: 10
    refine_score_thresh: 0.1
    refine_vgicp_resolution: 0.5
