bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /Odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    default_nav_to_pose_bt_xml: "$(find-pkg-share challenge_bringup)/behavior_trees/navigate_to_pose_no_spin.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share challenge_bringup)/behavior_trees/navigate_through_poses_no_spin.xml"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      # Path planning (core)
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_remove_passed_goals_action_bt_node  # For navigate_through_poses
      
      # Recovery/Clearing (your BTs use these)
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_clear_costmap_service_bt_node
      
      # Conditions (core)
      - nav2_goal_updated_condition_bt_node
      
      # Control flow (core)
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_rate_controller_bt_node
      - nav2_is_stuck_condition_bt_node  # Detects if progress has stalled
      - nav2_round_robin_node_bt_node  # REQUIRED: navigate_to_pose_no_spin.xml / navigate_through_poses_no_spin.xml RecoveryFallback uses <RoundRobin> to cycle ClearCostmaps/Wait/BackUp

      # ============ OPTIONAL RECOVERY BEHAVIORS ============
      # - nav2_spin_action_bt_node  # 360° rotation recovery (removed: caused backward wall collisions)
      # - nav2_drive_on_heading_bt_node  # Move forward/backward in specific heading (useful for aligned recovery)
      # - nav2_assisted_teleop_action_bt_node  # Manual teleop control during stuck (useful if manual recovery needed)

      # ============ OPTIONAL CONDITIONS ============
      # - nav2_goal_reached_condition_bt_node  # Check if goal position reached (FollowPath already checks this)
      # - nav2_is_stuck_condition_bt_node  # Detect robot stuck (useful if frequent stalls)
      # - nav2_is_path_valid_condition_bt_node  # Check if computed path is valid (useful for validation)
      # - nav2_transform_available_condition_bt_node  # Check if TF frame available (useful for multi-robot)
      # - nav2_time_expired_condition_bt_node  # Check if timeout reached (useful for deadline-based nav)
      # - nav2_globally_updated_goal_condition_bt_node  # Check if new global goal received (for multi-goal scenarios)
      # - nav2_initial_pose_received_condition_bt_node  # Check if initial pose set (useful for startup validation)
      # - nav2_is_battery_low_condition_bt_node  # Monitor battery level (useful for power management)
      # - nav2_is_battery_charging_condition_bt_node  # Monitor charging status (useful for docking)

      # ============ OPTIONAL PATH SMOOTHING ============
      # - nav2_smooth_path_action_bt_node  # Smooth path after planning (rarely needed if planner already smooth)

      # ============ OPTIONAL CONTROL FLOW ============
      # nav2_round_robin_node_bt_node moved to "Control flow (core)" above - it is
      # REQUIRED by the active no_spin BTs' <RoundRobin> recovery cycling, not optional.
      # - nav2_distance_controller_bt_node  # Throttle action by distance traveled (useful for sparse replan)
      # - nav2_speed_controller_bt_node  # Throttle action by speed (useful for adaptive navigation)
      # - nav2_truncate_path_action_bt_node  # Shorten path to local window (useful for MPC controllers)
      # - nav2_truncate_path_local_action_bt_node  # Same but local-focused variant
      # - nav2_goal_updater_node_bt_node  # Dynamically update goals (useful if goals change mid-nav)
      # - nav2_single_trigger_bt_node  # Run action once then skip (useful for one-time operations)
      # - nav2_planner_selector_bt_node  # Switch between multiple planners at runtime (useful if planner_id varies)
      # - nav2_controller_selector_bt_node  # Switch between multiple controllers (useful if controller_id varies)
      # - nav2_goal_checker_selector_bt_node  # Switch goal checkers (rarely used)

      # ============ OPTIONAL NAVIGATION FLOW ============
      # - nav2_navigate_to_pose_action_bt_node  # High-level navigate-to-pose (alternative to lower-level compose)
      # - nav2_navigate_through_poses_action_bt_node  # High-level navigate-through-poses (alternative to lower-level)
      # - nav2_path_longer_on_approach_condition_bt_node  # Detect if replanned path is longer near goal (safety check)
      # - nav2_path_expiring_timer_condition  # Check if path is stale (useful for fast-moving environments)
      # - nav2_distance_traveled_condition_bt_node  # Check distance traveled (useful for progress monitoring)

      # ============ OPTIONAL SERVICE CALLS ============
      # - nav2_reinitialize_global_localization_service_bt_node  # Reset AMCL particles (not needed: using custom localization)

      # ============ CANCEL ACTIONS (for recovery sequences) ============
      # - nav2_spin_cancel_bt_node  # Cancel spin action (use if adding nav2_spin_action_bt_node)
      # - nav2_back_up_cancel_bt_node  # Cancel backup action (use if complex backup recovery)
      # - nav2_assisted_teleop_cancel_bt_node  # Cancel teleop (use if adding assisted_teleop)
      # - nav2_drive_on_heading_cancel_bt_node  # Cancel heading-based drive (use if adding drive_on_heading)
      # - nav2_wait_cancel_bt_node  # Cancel wait (rarely needed)
      # - nav2_controller_cancel_bt_node  # Cancel controller (rarely needed if using recovery node)


bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    # PurePursuitController parameters
    FollowPath:
      plugin: "motion_controller::PurePursuitController"
      use_sim_time: False
      base_frame: base_link
      odom_frame: odom
      robot_clearance: 0.25
      cmd_vel_topic: "/cmd_vel"
      lookahead_distance: 0.2
      linear_velocity: 0.3
      max_angular_velocity: 1.0
      minimum_angular_velocity: 0.12
      rotate_in_place_threshold: 1.0
      minimum_turning_velocity: 0.05
      goal_tolerance: 0.15
      transform_tolerance: 0.1
      collision_check_enabled: true
      occupied_threshold: 253
      unknown_is_occupied: true
      collision_check_resolution: 0.05


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Must be >= robot_radius (0.22) so the InflationLayer's own
        # "inscribed obstacle" zone actually extends to cover the robot's
        # full body -- it was 0.05 (smaller than the robot itself), which
        # meant recovery-behavior footprint checks and RViz's danger-zone
        # display both understated how close the robot really was to a wall.
        inflation_radius: 0.30
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: -0.2
        z_resolution: 0.125
        z_voxels: 16
        max_obstacle_height: 2.0
        # Require 2+ marked voxels in a column before projecting it as a
        # lethal 2D cell. mark_threshold: 0 meant a single noisy/spurious
        # lidar point (e.g. during FAST-LIO2 IMU-buffer-clear events) was
        # enough to paint a phantom obstacle right next to the robot,
        # triggering unnecessary backup recoveries.
        mark_threshold: 2
        observation_sources: cloud_registered_body
        cloud_registered_body:
          topic: /cloud_registered_body
          min_obstacle_height: 0.10
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.3
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: cloud_registered_body
        cloud_registered_body:
          topic: /cloud_registered_body
          min_obstacle_height: 0.10
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.3
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Same reasoning as local_costmap's inflation_radius above: must be
        # >= robot_radius (0.22) for the inscribed-obstacle zone to cover the
        # robot's full body.
        inflation_radius: 0.30
      always_send_full_costmap: True

